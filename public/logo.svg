<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Inner Lock Glow Gradient -->
    <linearGradient id="lockGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>

    <linearGradient id="shackleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1E1B4B" flood-opacity="0.35"/>
    </filter>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#38BDF8" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Shield Path with Glow Shadow -->
  <path d="M256 32 
           C340 32, 416 64, 448 96 
           C448 240, 416 384, 256 480 
           C96 384, 64 240, 64 96 
           C96 64, 172 32, 256 32 Z" 
        fill="url(#shieldGrad)" 
        filter="url(#dropShadow)" />

  <!-- Shield Inner Border Highlight -->
  <path d="M256 52 
           C330 52, 396 80, 424 108 
           C424 236, 396 364, 256 452 
           C116 364, 88 236, 88 108 
           C116 80, 182 52, 256 52 Z" 
        fill="none" 
        stroke="rgba(255, 255, 255, 0.25)" 
        stroke-width="6" />

  <!-- Padlock Shackle -->
  <path d="M192 230 
           V170 
           C192 134.65, 220.65 106, 256 106 
           C291.35 106, 320 134.65, 320 170 
           V230" 
        fill="none" 
        stroke="url(#shackleGrad)" 
        stroke-width="28" 
        stroke-linecap="round" 
        filter="url(#glow)" />

  <!-- Padlock Body -->
  <rect x="160" y="216" width="192" height="152" rx="28" 
        fill="url(#lockGrad)" 
        filter="url(#dropShadow)" />

  <!-- Keyhole Top Circle -->
  <circle cx="256" cy="276" r="20" fill="#1E293B" />

  <!-- Keyhole Bottom Slot -->
  <path d="M246 284 L266 284 L272 324 L240 324 Z" fill="#1E293B" />

  <!-- Cryptographic Tech Nodes / Accent Lines -->
  <circle cx="120" cy="256" r="6" fill="#38BDF8" opacity="0.8"/>
  <circle cx="392" cy="256" r="6" fill="#38BDF8" opacity="0.8"/>
  <line x1="120" y1="256" x2="160" y2="256" stroke="#38BDF8" stroke-width="3" stroke-dasharray="4 4" opacity="0.7"/>
  <line x1="352" y1="256" x2="392" y2="256" stroke="#38BDF8" stroke-width="3" stroke-dasharray="4 4" opacity="0.7"/>
</svg>
